<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat Client</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --border: #2a2e37;
    --text: #e7e9ee;
    --muted: #8b90a0;
    --accent: #5b8cff;
    --system: #6f7585;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* --- Join screen --- */
  #join-screen {
    width: 320px;
    padding: 28px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  #join-screen h1 {
    font-size: 18px;
    margin: 0 0 4px;
  }
  #join-screen p {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 20px;
  }
  #join-screen input {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 12px;
  }
  #join-screen button {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #join-error {
    color: #ff7b7b;
    font-size: 12px;
    margin-top: 8px;
    min-height: 14px;
  }

  /* --- Chat screen --- */
  #chat-screen {
    width: 100%;
    max-width: 900px;
    height: 90vh;
    max-height: 800px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  #chat-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #chat-header .who { font-size: 14px; font-weight: 600; }
  #chat-header .status { font-size: 12px; color: var(--muted); }

  #room-panel {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }
  #room-panel span.name {
    display: inline-block;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 999px;
    margin: 2px 4px 0 0;
    color: var(--text);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 65%;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .msg .sender {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .msg.system {
    align-self: center;
    color: var(--system);
    font-size: 12px;
    background: none;
    padding: 2px 0;
  }
  .msg.theirs { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); }
  .msg.mine { align-self: flex-end; background: var(--accent); color: white; }
  .msg.mine .sender { color: rgba(255,255,255,0.75); }

  #input-row {
    display: flex;
    padding: 12px;
    border-top: 1px solid var(--border);
    gap: 8px;
  }
  #msg-input {
    flex: 1;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
  }
  #send-btn {
    padding: 10px 16px;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

  <div id="join-screen">
    <h1>Join the room</h1>
    <p>Connects to your FastAPI WebSocket server.</p>
    <input id="server-url" placeholder="ws://localhost:8000/ws" value="ws://localhost:8000/ws">
    <input id="username-input" placeholder="Your name" maxlength="20">
    <button id="join-btn">Join</button>
    <div id="join-error"></div>
  </div>

  <div id="chat-screen">
    <div id="chat-header">
      <div class="who" id="who-label"></div>
      <div class="status" id="status-label">connecting...</div>
    </div>
    <div id="room-panel">Already here: <span id="room-list">—</span></div>
    <div id="messages"></div>
    <div id="input-row">
      <input id="msg-input" placeholder="Type a message..." disabled>
      <button id="send-btn" disabled>Send</button>
    </div>
  </div>

<script>
  const joinScreen = document.getElementById('join-screen');
  const chatScreen = document.getElementById('chat-screen');
  const joinBtn = document.getElementById('join-btn');
  const joinError = document.getElementById('join-error');
  const serverUrlInput = document.getElementById('server-url');
  const usernameInput = document.getElementById('username-input');
  const whoLabel = document.getElementById('who-label');
  const statusLabel = document.getElementById('status-label');
  const roomList = document.getElementById('room-list');
  const messagesEl = document.getElementById('messages');
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');

  let socket = null;
  let myUsername = '';

  function addMessage(text, type) {
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    if (type === 'system') {
      div.textContent = text;
    } else {
      const parts = text.split(':');
      const sender = parts[0];
      const body = parts.slice(1).join(':').trim();
      div.innerHTML = `<div class="sender">${sender}</div>${body}`;
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  joinBtn.addEventListener('click', () => {
    const base = serverUrlInput.value.trim().replace(/\/$/, '');
    const username = usernameInput.value.trim();
    if (!username) {
      joinError.textContent = 'Enter a name to join.';
      return;
    }
    joinError.textContent = '';
    myUsername = username;
    const url = `${base}/${encodeURIComponent(username)}`;

    socket = new WebSocket(url);

    socket.onopen = () => {
      joinScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      whoLabel.textContent = username;
      statusLabel.textContent = 'connected';
      msgInput.disabled = false;
      sendBtn.disabled = false;
      msgInput.focus();
    };

    socket.onmessage = (event) => {
      const data = event.data;

      // heuristic: messages ending in "joined" / "has left" / room list -> system-ish
      if (data.includes(' in the room') || data.endsWith('joined') || data.endsWith('has left')) {
        if (data.includes(' in the room')) {
          const names = data.replace(' in the room', '').trim();
          roomList.textContent = names || '—';
        }
        addMessage(data, 'system');
        return;
      }

      const isMine = data.startsWith(myUsername + ':');
      addMessage(data, isMine ? 'mine' : 'theirs');
    };

    socket.onclose = (event) => {
      statusLabel.textContent = 'disconnected';
      msgInput.disabled = true;
      sendBtn.disabled = true;

      // if the connection was rejected with a reason (e.g. duplicate username),
      // show it back on the join screen and let the user try again
      if (event.reason) {
        chatScreen.style.display = 'none';
        joinScreen.style.display = 'block';
        joinError.textContent = event.reason;
      }
    };

    socket.onerror = () => {
      statusLabel.textContent = 'connection error';
    };
  });

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;
    socket.send(text);
    addMessage(`${myUsername}: ${text}`, 'mine');
    msgInput.value = '';
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
</script>
</body>
</html>
